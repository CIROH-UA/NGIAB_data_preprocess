### Single-catchment configuration ###
catchment_id: {divide_id}
catchment_name: {divide_id}

# Static catchment attributes
aridity: {aridity}
meanP: {meanP}
ETPOT_Hargr: {ETPOT_Hargr}
NDVI: {NDVI}
FW: {FW}
meanslope: {meanslope}
SoilGrids1km_sand: {SoilGrids1km_sand}
SoilGrids1km_clay: {SoilGrids1km_clay}
SoilGrids1km_silt: {SoilGrids1km_silt}
glaciers: {glaciers}
HWSD_clay: {HWSD_clay}
HWSD_gravel: {HWSD_gravel}
HWSD_sand: {HWSD_sand}
HWSD_silt: {HWSD_silt}
meanelevation: {meanelevation}
meanTa: {meanTa}
permafrost: {permafrost}
permeability: {permeability}
seasonality_P: {seasonality_P}
seasonality_PET: {seasonality_PET}
snow_fraction: {snow_fraction}
snowfall_fraction: {snowfall_fraction}
T_clay: {T_clay}
T_gravel: {T_gravel}
T_sand: {T_sand}
T_silt: {T_silt}
Porosity: {Porosity}
uparea: {uparea}
catchsize: {areasqkm}
lengthkm: {lengthkm}

# BMI
model_dir: /ngen/ngen/extern/dhbv2/ngen_resources/data/dhbv_2_mts/model/dhbv_2_mts
dtype: float32
verbose: false

# PET calculation method: 'penman_monteith' (default) or 'hargreaves'
pet_method: penman_monteith
latitude: {latitude}

warmup:
  # Daily->hourly handoff cadence (how long the hourly model runs before
  # retrieving states from the daily model)
  cycle_days: 14

  daily_mode: periodic  # options: periodic, once, cold
  daily_warmup_days: 351  # Inactive if daily_mode=cold
  hourly_mode: periodic  # options: periodic, cold
  hourly_warmup_hours: 336  # Inactive if hourly_mode=cold
